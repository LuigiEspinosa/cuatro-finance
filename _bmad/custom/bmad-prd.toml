# Team override for bmad-prd, per the tooling work order
# (_bmad-output/planning-artifacts/research/tooling-setup-2026-11-26.md,
# section 3.8): product-lens joins the reviewer gate's menu.
# Verify the merge with:
#   uv run _bmad/scripts/resolve_customization.py --skill .claude/skills/bmad-prd --project-root . --key workflow

[workflow]

finalize_reviewers = [
  """Product lens review: read `~/.claude/skills/product-lens/SKILL.md` (resolve `~` to `$HOME` or `%USERPROFILE%` first) and apply its Mode 1 (Product Diagnostic) questions to `prd.md` only, answering them from the document. Ask the user nothing, install or run nothing, write only the reviewer gate's review file (never PRODUCT-BRIEF.md), do not spawn subagents of your own, and return the compact summary the gate expects.""",
]
