  """Use the `e2e-testing` and `ai-regression-testing` skills.""",
  """Before creating a test folder, run `git check-ignore -v <folder>`: `.gitignore` has carried placeholder patterns such as `*test`, `*tests` and `*testing` that silently ignore folders with those names.""",
