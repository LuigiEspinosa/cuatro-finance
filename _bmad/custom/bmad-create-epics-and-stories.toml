[workflow]

persistent_facts = [
  """Every UI story names, in its spec, the design skills and modern-web-guidance guides its implementer needs: `animate` for motion, `apple-design` for type and for hover, focus and press states, `mobile-native` for viewport, inputs and touch, `dataviz` for charts, `frontend-design` for a new screen, and the guide id for each web platform pattern. The story spec is how they reach Build's implementer, which starts with no other context.""",
